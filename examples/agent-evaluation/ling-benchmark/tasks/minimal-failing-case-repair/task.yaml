id: minimal-failing-case-repair
instructions: |
  The existing regression test fails because scenario.yaml expects the wrong one-word response.
  Repair only that expected value so it matches the prompt's READY requirement. Keep the scenario
  otherwise unchanged and run the acceptance command before finishing.
fixturePath: fixture
allowedPaths:
  - scenario.yaml
allowedTools:
  - workspace_read
  - workspace_patch
  - workspace_status
  - workspace_diff
  - workspace_run
maxActions: 10
timeoutMs: 60000
acceptanceCommands:
  - bun test acceptance.test.ts
requiredArtifactChecks:
  - minimal-repair-matches-expected
artifactChecks:
  - id: minimal-repair-matches-expected
    path: scenario.yaml
    expectedPath: expected/scenario.yaml
models:
  - Ling-3.0-flash

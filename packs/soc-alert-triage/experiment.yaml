# Draft, unreviewed experiment for the soc-alert-triage pack. See README.md before using results;
# they are not claims until a qualified SOC reviewer signs off.
#
# Targets are open-weight models published by Qwen (Apache-2.0), run locally through Ollama's
# OpenAI-compatible endpoint. This is not native Ollama support. Local deployments have no metered
# cost, so no cost is reported.
#
# Generated file: experiment.yaml is written from this template by
#   bun packs/_tools/generate-experiment.ts packs/soc-alert-triage --language en --policy soc-rulebook-v1
# Task source paths are relative to this directory (packs/soc-alert-triage/).
# Identities (recomputed by pack.test.ts):
#   task digest     = SHA-256 of the exact task file bytes
#   workload digest = SHA-256 of JSON.stringify([[path, digest], ...]) sorted by path
#   rubric digest   = SHA-256 of RUBRIC.md
# Task `policy` names the synthetic rulebook the task is scored against (SYN-SOC v1.0).

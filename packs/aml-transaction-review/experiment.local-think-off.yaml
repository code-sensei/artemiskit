# Live local benchmark experiment for the aml-transaction-review pack (draft, unreviewed): thinking OFF.
# See README.md before using results. Results qualify the method; they are not a model ranking.
#
# Tasks and identities are copied exactly from experiment.yaml (full pack). Regenerate this file
# whenever experiment.yaml changes. Companion file: experiment.local-think-on.yaml (same tasks, other mode).
#
# Targets: open-weight models published by Qwen (Apache-2.0), run locally through Ollama's
# OpenAI-compatible endpoint (http://127.0.0.1:11434/v1). This is not native Ollama support.
# Local deployments have no metered cost; cost is not applicable.
#
# Mode: thinking off (reasoning_effort none -> Ollama think=false).
# Sampling: Qwen non-thinking recommendation: temperature 0.7, top_p 0.8, presence_penalty 1.5; top_k 20 and min_p come from the models' Ollama defaults
# (ollama show --parameters: top_k 20, no min_p set, so Ollama's default 0 applies). ArtemisKit
# does not send top_k/min_p on this path. Output cap 4,096 tokens per request.
# Server: OLLAMA_CONTEXT_LENGTH=8192 (longest prompt 2,492 tokens + output cap), OLLAMA_NUM_PARALLEL=1,
# KV cache f16 (default), flash attention auto (default; enabled on Metal).
#
# Seeds: repetition r sends seed 20261119 + (r - 1) with every request of that repetition.
# Concurrency 1 (measured 2026-11-19 at 1, 2 and 4): Ollama 0.33.3 serves the qwen35 architecture one
# request at a time ("model architecture does not currently support parallel requests"), and the two
# models do not stay resident together on the 24 GiB host, so parallel requests only queue and gave
# no throughput gain. Seeded repeats of one request were byte-identical; a 3-task CLI rerun matched
# in 21 of 22 responses, so sampled outputs are not guaranteed bitwise reproducible.

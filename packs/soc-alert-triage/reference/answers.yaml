soc-01-phishing-execution:
  macro-powershell-c2:
    answer:
      classification: true_positive
      severity: high
      attack_techniques:
        - T1566.001
        - T1204.002
        - T1059.001
        - T1071.001
      decision: contain
      evidence_steps:
        - Capture memory of WS-FIN-07 before any reimage
        - Export EDR process tree and PowerShell script-block logs
        - Search mail logs for other recipients of the sender domain
      containment_actions:
        - Isolate WS-FIN-07 from the network
        - Block update-cdn.example at the proxy
      human_approval_required: true
      rule_ids:
        - SOC-R05
        - SOC-R02
        - SOC-R08
      rationale: Malicious macro led to PowerShell execution and ongoing C2; host compromise without confirmed impact is high. Containment needs approval.
    fail_answers:
      - classification: true_positive
        severity: high
        attack_techniques:
          - T1566.001
          - T1059.001
        decision: contain
        evidence_steps:

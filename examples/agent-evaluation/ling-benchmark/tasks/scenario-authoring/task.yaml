id: scenario-authoring
instructions: |
  Complete scenario.yaml from the supplied feature requirement: create one deterministic
  Ling scenario that classifies the invoice-copy request as exactly "billing". Preserve the
  existing scenario metadata, change only scenario.yaml, and run the acceptance command before
  finishing.
fixturePath: fixture
allowedPaths:
  - scenario.yaml
allowedTools:
  - workspace_read
  - workspace_patch
  - workspace_status
  - workspace_diff
  - workspace_run
maxActions: 12
timeoutMs: 60000
acceptanceCommands:
  - akit validate scenario.yaml
requiredArtifactChecks:
  - scenario-authoring-matches-expected
artifactChecks:
  - id: scenario-authoring-matches-expected
    path: scenario.yaml
    expectedPath: expected/scenario.yaml
models:
  - Ling-3.0-flash
  - Ling-3.0-tiny

id: scenario-repair
instructions: |
  Repair scenario.yaml so that ArtemisKit accepts it. Change only the invalid
  expectation type, preserve the scenario's intended assertion, and keep the
  diff minimal. Run the acceptance command before finishing.
fixturePath: fixture
allowedPaths:
  - scenario.yaml
allowedTools:
  - workspace_read
  - workspace_patch
  - workspace_status
  - workspace_diff
  - workspace_run
maxActions: 10
timeoutMs: 60000
acceptanceCommands:
  - akit validate scenario.yaml
